# ==============================================================================
# SATGUARDIAN EDGE WAF - PRODUCTION CONFIGURATION
# Sub-Millisecond Deterministic SAT Cyber-Defense & Reverse Proxy
# 100% Free & Unlimited Edge Traffic (Open Source Edge WAF)
# Cloud Boolean Minimization Powered by Security Units (SU) via satguardian.tech
# ==============================================================================

# Inbound network listener for HTTP traffic to be protected
listen_addr = "0.0.0.0:8080"

# Target upstream backend application (Nginx, Node, Python, Go, Java, PHP, etc.)
upstream_url = "http://127.0.0.1:3000"

# Defense mode:
#   "block"   - Active perimeter defense: instantly drops attacks with HTTP 403
#   "monitor" - Passive / dry-run mode: logs violations but allows traffic upstream
mode = "block"

# ------------------------------------------------------------------------------
# STEALTH MODE (Anti-Reconnaissance Protection)
# ------------------------------------------------------------------------------
# true  -> Emits clean web-standard 403 Forbidden without leaking rules, proof or LaTeX.
# false -> Emits verbose diagnostic JSON containing formal causal & LaTeX proof (debug mode).
stealth_mode = true

# Optional custom HTML or text response when stealth_mode = true
# stealth_block_body = "<html><head><title>403 Forbidden</title></head><body><center><h1>403 Forbidden</h1></center></body></html>"

# ------------------------------------------------------------------------------
# CLOUD OPTIMIZATION SERVICE (Security Units - SU)
# ------------------------------------------------------------------------------
# SATGuardian Cloud Optimization API URL for Autonomous Boolean Minimization.
# Traffic inspection is 100% local and free (zero customer traffic touches our cloud).
# Cloud synthesis consumes Security Units (SU) per Boolean minimization job.
# When your SU balance is exhausted, cloud optimization pauses but the Edge WAF
# continues protecting actively with your latest compiled rule matrix.
satguardian_api_url = "https://satguardian.tech/api/simplify"

# Cloud API Key (or set via SATGUARDIAN_API_KEY environment variable)
# satguardian_api_key = "ek_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# SQLite WAL Ledger database location for audit logging and novel anomaly clustering
database_path = "waf_ledger.db"

# Autonomous background minimization sync interval in seconds (default: 300s / 5 mins)
autonomous_sync_interval_secs = 300

# Enable automatic hot minimization sync with https://satguardian.tech
auto_sync_enabled = true

# ==============================================================================
# STATEFUL & BEHAVIORAL DEFENSE (Layer-7 DDoS, Brute Force & Credential Stuffing)
# ==============================================================================
# Enable temporal sliding window ring buffer analysis
stateful_enabled = true

# Max total requests permitted in sliding window per IP across all endpoints
stateful_global_limit = 300

# Max attempts permitted on sensitive authentication endpoints (/login, /auth, etc.)
stateful_auth_limit = 20

# Sliding temporal window duration in seconds (default: 60s ring buffer)
stateful_window_secs = 60

# Temporary isolation quarantine / jail duration in seconds for offenders (default: 180s)
stateful_ban_secs = 180

# Optional Redis connection URL for distributed cluster state synchronization (leave empty for built-in high-speed in-memory ring buffer)
# redis_url = "redis://127.0.0.1:6379"

# ==============================================================================
# ENVOY PROXY EXT_AUTHZ INTEGRATION
# ==============================================================================
# Inbound HTTP listener for Envoy's envoy.filters.http.ext_authz filter
# When enabled, Envoy offloads SAT security checks to SATGuardian at sub-millisecond speeds.
envoy_ext_authz_addr = "0.0.0.0:9002"

# ==============================================================================
# SAFELINE WAF T1K CO-PROCESSOR INTEGRATION (Tier 0 Acceleration & Shared Reporting)
# ==============================================================================
# Inbound T1K binary protocol listener (e.g. 0.0.0.0:8000 or unix socket)
# t1k_listen_addr = "0.0.0.0:8000"

# Target downstream SafeLine detector (snserver) for deep semantic analysis of benign traffic
# t1k_downstream_addr = "172.22.0.5:8000"

# SafeLine PostgreSQL instance URL to stream live incident proofs directly into SafeLine Console
# safeline_pg_url = "postgres://safeline-ce:safeline-ce@safeline-pg:5432/safeline-ce?sslmode=disable"
    
# ==============================================================================
# MODULAR CERTAINTY ISLANDS
# ==============================================================================
[islands]
# WordPress Reconnaissance & Exploit Shield:
# Drops scanner probes targeting /wp-admin, /wp-login.php, xmlrpc.php, etc.
# Set to false ONLY if your application legitimately runs WordPress.
wordpress_shield = true

# Sensitive Files & Backdoors Shield:
# Blocks discovery probes targeting /.env, /.git, phpMyAdmin, actuator, backup dumps.
exposure_shield = true

# Modern Framework Exploits Shield:
# Blocks Log4j/JNDI injection, Spring Cloud SpEL, Laravel Ignition, ThinkPHP probes.
framework_shield = true

# ==============================================================================
# CUSTOMER BUSINESS RULES (DECLARATIVE ACCESS CONTROL)
# ==============================================================================
[business_rules]
enabled = true

# Example Rule 1: Restrict HTTP methods on sensitive API endpoints
[[business_rules.rules]]
id = "biz-api-methods"
name = "Strict API Method Whitelist"
path_prefix = "/api/v1/"
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
blocked_methods = ["TRACE", "CONNECT", "PATCH"]
allowed_ips = []
blocked_ips = []
required_headers = []
max_body_bytes = 10485760 # 10 MB payload ceiling
enabled = true

# Example Rule 2: IP-Whitelisted Administrative Gateway
[[business_rules.rules]]
id = "biz-admin-gateway"
name = "Admin Portal IP Restricted Access"
path_prefix = "/internal/admin/"
allowed_methods = ["GET", "POST"]
blocked_methods = []
allowed_ips = ["127.0.0.1", "10.0.0.1", "192.168.1.100"] # Whitelist authorized admin IPs
blocked_ips = []
required_headers = ["X-Admin-Token"] # Mandatory administrative header
max_body_bytes = 1048576 # 1 MB
enabled = false # Enable when internal admin route is active

# Rule approved by Administrator via GUARDIAN-ADVISOR
[[business_rules.rules]]
id = "biz-method-api-v1-products"
name = "Method Restriction for /api/v1/products"
path_prefix = "/api/v1/products"
allowed_methods = ["GET", "OPTIONS"]
blocked_methods = ["DELETE", "PUT", "PATCH", "TRACE", "CONNECT"]
allowed_ips = []
blocked_ips = []
required_headers = []
max_body_bytes = 10485760
enabled = true



