# ==============================================================================
# SATGUARDIAN EDGE WAF + ENVOY PROXY: KUBERNETES SIDECAR MANIFEST
# Model: Envoy ext_authz Filter over Shared Local Unix Domain Socket (UDS)
# Performance: < 15 µs In-Pod Latency, Zero Network Hops, Zero Request Charges
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secured-api-gateway
  namespace: production
  labels:
    app: secured-api
    security.satguardian.tech/injected: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secured-api
  template:
    metadata:
      labels:
        app: secured-api
    spec:
      volumes:
        # Shared high-speed memory volume for Unix Domain Socket IPC
        - name: satguardian-ipc
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # Persistent storage for local SQLite WAL forensic ledger
        - name: satguardian-ledger
          emptyDir: {}
        # Envoy configuration map
        - name: envoy-config-vol
          configMap:
            name: envoy-sidecar-config

      containers:
        # ----------------------------------------------------------------------
        # Container 1: The Cloud-Native Aircraft Carrier (Envoy Proxy 1.30+)
        # Terminating TLS, connection pooling, and dispatching ext_authz
        # ----------------------------------------------------------------------
        - name: envoy-proxy
          image: envoyproxy/envoy:v1.30-latest
          command: ["envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "prod-cluster"]
          ports:
            - containerPort: 10000
              name: http-ingress
            - containerPort: 9901
              name: envoy-admin
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            - name: envoy-config-vol
              mountPath: /etc/envoy
            - name: satguardian-ipc
              mountPath: /var/run/satguardian

        # ----------------------------------------------------------------------
        # Container 2: SATGuardian Edge WAF Sidecar Daemon (Rust)
        # Deterministic Boolean SAT engine running locally in sub-50 microseconds
        # ----------------------------------------------------------------------
        - name: satguardian-waf-sidecar
          image: satguardian/satguardian-waf:v0.3.0
          command: ["/usr/local/bin/satguardian-waf"]
          args:
            - "envoy-authz"
            - "--socket"
            - "/var/run/satguardian/waf.sock"
          env:
            - name: WAF_MODE
              value: "block"
            - name: SATGUARDIAN_API_URL
              value: "https://satguardian.tech/api/simplify"
            - name: SATGUARDIAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: satguardian-cloud-credentials
                  key: api-token
                  optional: true
            - name: WAF_DATABASE_PATH
              value: "/var/lib/satguardian/waf_ledger.db"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: satguardian-ipc
              mountPath: /var/run/satguardian
            - name: satguardian-ledger
              mountPath: /var/lib/satguardian

        # ----------------------------------------------------------------------
        # Container 3: Protected Application Service (Business Logic)
        # ----------------------------------------------------------------------
        - name: app-backend
          image: mycompany/api-service:latest
          ports:
            - containerPort: 3000
              name: app-http
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "250m"
              memory: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
  namespace: production
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 127.0.0.1
          port_value: 9901
    static_resources:
      listeners:
      - name: ingress_listener
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: app_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: local_app_service
              http_filters:
              # In-Pod Zero-Copy SAT Verification via UDS
              - name: envoy.filters.http.ext_authz
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  http_service:
                    server_uri:
                      uri: "http://unix/ext_authz"
                      cluster: satguardian_sidecar_uds
                      timeout: 0.10s
                    authorization_request:
                      allowed_headers:
                        patterns:
                        - exact: "authorization"
                        - exact: "cookie"
                        - exact: "x-forwarded-for"
                        - exact: "user-agent"
                        - exact: "content-type"
                        - prefix: "x-"
                    authorization_response:
                      allowed_upstream_headers:
                        patterns:
                        - prefix: "x-satguardian-"
                      allowed_client_headers:
                        patterns:
                        - prefix: "x-satguardian-"
                        - exact: "content-type"
                  with_request_body:
                    max_request_bytes: 65536
                    pack_as_bytes: false
                    allow_partial_message: true
                  failure_mode_allow: false
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: satguardian_sidecar_uds
        connect_timeout: 0.10s
        load_assignment:
          cluster_name: satguardian_sidecar_uds
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  pipe:
                    path: /var/run/satguardian/waf.sock
      - name: local_app_service
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: local_app_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 3000
