version: '3.8'

services:
  satguardian-waf:
    build:
      context: .
      dockerfile: Dockerfile
    image: satguardian-waf:latest
    container_name: satguardian-waf
    restart: always
    ports:
      - "8080:8080"
    environment:
      - WAF_LISTEN_ADDR=0.0.0.0:8080
      - WAF_UPSTREAM_URL=http://backend:3000
      - WAF_MODE=block
      - SATGUARDIAN_API_URL=https://satguardian.tech/api/simplify
      - WAF_DATABASE_PATH=/etc/satguardian/waf_ledger.db
    volumes:
      - ./waf_config.toml:/etc/satguardian/waf_config.toml:ro
      - waf_data:/etc/satguardian
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  waf_data:
    driver: local
