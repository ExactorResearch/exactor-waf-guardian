[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satguardian-waf"
version = "1.0.0"
description = "Deterministic Neuro-Symbolic SAT Web Application Firewall vs Pure LLM & Regex Baselines"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "RUSH Ecosystem", email = "dev@rush-ecosystem.io" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
